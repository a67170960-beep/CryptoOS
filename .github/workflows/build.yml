name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to the retired "tools" SDK package.
          packages: platform-tools

      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: .
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cryptoos-release.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          else
            unset ANDROID_KEYSTORE_PATH
          fi
          gradle --no-daemon assembleRelease
          mkdir -p build-output
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit \
            | xargs -r -I{} cp "{}" build-output/CryptoOS-release.apk
          test -s build-output/CryptoOS-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoOS-release-apk
          path: build-output/CryptoOS-release.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: CryptoOS-release-apk
          path: release-output

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/CryptoOS-release.apk
          generate_release_notes: true
