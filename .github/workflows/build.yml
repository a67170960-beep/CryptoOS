name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: .
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cryptoos-release.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          else
            unset ANDROID_KEYSTORE_PATH
          fi
          gradle --no-daemon assembleRelease
          mkdir -p build-output
          find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit \
            | xargs -r -I{} cp "{}" build-output/CryptoOS-release.apk
          test -s build-output/CryptoOS-release.apk

      - name: Upload APK for security check
        uses: actions/upload-artifact@v4
        with:
          name: CryptoOS-release-apk
          path: build-output/CryptoOS-release.apk
          if-no-files-found: error
          retention-days: 7

  security-check:
    name: SHA-256 and VirusTotal
    needs: build
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.scan.outputs.sha256 }}
      malicious: ${{ steps.scan.outputs.malicious }}
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: CryptoOS-release-apk
          path: build-output

      - name: Hash and scan APK
        id: scan
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          set -euo pipefail
          apk="build-output/CryptoOS-release.apk"
          test -s "$apk"
          sha256="$(sha256sum "$apk" | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "APK SHA-256: $sha256"

          if [[ -z "${VIRUSTOTAL_API_KEY:-}" ]]; then
            echo "::error::Add the VIRUSTOTAL_API_KEY repository secret to enable the required scan."
            exit 1
          fi

          upload="$(curl --fail-with-body --silent --show-error \
            -H "x-apikey: ${VIRUSTOTAL_API_KEY}" \
            -F "file=@${apk}" \
            https://www.virustotal.com/api/v3/files)"
          analysis_id="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["id"])' <<< "$upload")"
          echo "VirusTotal analysis submitted: $analysis_id"

          result=""
          for attempt in $(seq 1 40); do
            result="$(curl --fail-with-body --silent --show-error \
              -H "x-apikey: ${VIRUSTOTAL_API_KEY}" \
              "https://www.virustotal.com/api/v3/analyses/${analysis_id}")"
            status="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["data"]["attributes"]["status"])' <<< "$result")"
            if [[ "$status" == "completed" ]]; then
              break
            fi
            sleep 15
          done

          if [[ "${status:-}" != "completed" ]]; then
            echo "::error::VirusTotal analysis did not complete before timeout."
            exit 1
          fi

          malicious="$(python3 -c 'import json,sys; print(int(json.load(sys.stdin)["data"]["attributes"]["stats"].get("malicious", 0)))' <<< "$result")"
          echo "malicious=$malicious" >> "$GITHUB_OUTPUT"
          echo "VirusTotal malicious detections: $malicious"
          if (( malicious > 3 )); then
            echo "::error::VirusTotal reported more than 3 malicious detections; release is blocked."
            exit 1
          fi

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, security-check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download scanned APK
        uses: actions/download-artifact@v4
        with:
          name: CryptoOS-release-apk
          path: release-output

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/CryptoOS-release.apk
          generate_release_notes: true
