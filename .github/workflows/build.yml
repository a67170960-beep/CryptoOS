name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    outputs:
      signed_release: ${{ steps.signing.outputs.signed }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to the retired "tools" SDK package.
          packages: platform-tools

      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare optional release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" \
            && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/cryptoos-release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [[ -z "$ANDROID_KEYSTORE_BASE64" && -z "$ANDROID_KEYSTORE_PASSWORD" \
            && -z "$ANDROID_KEY_ALIAS" && -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No release keystore configured; building an installable debug APK."
          else
            echo "Configure all four Android signing secrets, or remove all of them." >&2
            exit 1
          fi

      - name: Build APKs
        working-directory: .
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/cryptoos-release.jks
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SIGNED_RELEASE: ${{ steps.signing.outputs.signed }}
        run: |
          gradle --no-daemon assembleDebug assembleRelease
          mkdir -p build-output
          cp app/build/outputs/apk/debug/app-debug.apk build-output/CryptoOS-debug.apk
          test -s build-output/CryptoOS-debug.apk
          if [[ "$SIGNED_RELEASE" == "true" ]]; then
            cp app/build/outputs/apk/release/app-release.apk build-output/CryptoOS-release.apk
            test -s build-output/CryptoOS-release.apk
          fi
          apksigner verify --verbose build-output/CryptoOS-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoOS-installable-debug-apk
          path: build-output/CryptoOS-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed release APK
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CryptoOS-signed-release-apk
          path: build-output/CryptoOS-release.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish signed tagged release
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.signed_release == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@v4
        with:
          name: CryptoOS-signed-release-apk
          path: release-output

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/CryptoOS-release.apk
          generate_release_notes: true
